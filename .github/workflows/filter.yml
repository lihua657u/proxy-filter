name: Filter Proxies

on:
  schedule:
    # UTC 20:00 / 03:00 / 10:00 = Beijing 04:00 / 11:00 / 18:00
    - cron: '0 20,3,10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Start subconverter
        run: |
          docker run -d --name subconverter -p 25500:25500 tindy2013/subconverter:latest
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:25500/version >/dev/null 2>&1 && break
            sleep 2
          done

      - name: Convert each source separately
        run: |
          i=0
          for u in \
            "https://raw.githubusercontent.com/kooker/FreeSubsCheck/main/base64.txt" \
            "https://raw.githubusercontent.com/Pawdroid/Free-servers/main/sub" \
            "https://raw.githubusercontent.com/zhuhaiuk/free-nodes/main/clash_config.yaml" \
            "https://gist.githubusercontent.com/lihua657u/7d347996db4ebfbc52d034cd225010c3/raw/clash.yaml" \
            "https://103.14.76.98/sub/fsc/689fff64262b5ae867b12698c7086b0e"; do
            i=$((i+1))
            if curl -sf -G http://127.0.0.1:25500/sub \
                 --data-urlencode "target=clash" \
                 --data-urlencode "url=$u" \
                 -o "src_$i.yaml"; then
              echo "src_$i: $(sed -n '/^proxies:/,/^proxy-groups:/p' src_$i.yaml | grep -c 'name:')"
            else
              echo "src_$i: FETCH_OR_CONVERT_FAILED $u"
            fi
          done

      - name: Fetch source 6 as Clash YAML (no conversion, keeps all nodes)
        run: |
          for u in \
            "https://ghfast.top/https://raw.githubusercontent.com/free18/v2ray/refs/heads/main/c.yaml" \
            "https://cdn.jsdelivr.net/gh/free18/v2ray@main/c.yaml" \
            "https://raw.githubusercontent.com/free18/v2ray/refs/heads/main/c.yaml"; do
            if curl -sf -m 60 "$u" -o src_6.yaml && grep -q "^proxies:" src_6.yaml; then
              echo "src_6 OK from $u"
              echo "src_6 nodes: $(sed -n '/^proxies:/,/^proxy-groups:/p' src_6.yaml | grep -c '^  - ')"
              break
            else
              echo "src_6 mirror failed: $u"
            fi
          done

      - name: Merge all sources
        run: python3 merge.py src_*.yaml merged.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Install clash-speedtest
        run: go install github.com/faceair/clash-speedtest@latest

      - name: Filter nodes
        run: |
          rm -f clash.yaml
          "$(go env GOPATH)/bin/clash-speedtest" \
            -c merged.yaml -output clash.yaml \
            -max-latency 400ms -min-download-speed 2 \
            -download-size 1048576 -concurrent 16 -timeout 8s || true
          if [ -s clash.yaml ]; then
            echo "kept: $(sed -n '/^proxies:/,/^proxy-groups:/p' clash.yaml | grep -c 'name:')"
          else
            echo "NO_RESULT keep previous clash.yaml"
          fi

      - name: Wrap into a valid Clash config
        run: |
          if [ -s clash.yaml ]; then
            mv clash.yaml speedtest_out.yaml
            python3 merge.py speedtest_out.yaml clash.yaml
            echo "groups: $(grep -c 'type: select' clash.yaml) select / $(grep -c 'type: url-test' clash.yaml) url-test"
          fi

      - name: Commit result
        run: |
          if [ -s clash.yaml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f clash.yaml
            git diff --cached --quiet || git commit -m "chore: refresh filtered proxies"
            git push
          fi
